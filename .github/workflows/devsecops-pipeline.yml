name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Secret Scanner (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: secret-scan
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/api/package-lock.json

      # Frontend Tests
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Lint Frontend
        working-directory: ./frontend
        env:
          VITE_USE_MOCK: "false"
        run: npm run lint

      - name: Test Frontend
        working-directory: ./frontend
        run: npm test

      # Backend Tests
      - name: Install Backend API Dependencies
        working-directory: ./backend/api
        run: npm ci

      - name: Install Backend Database Dependencies
        working-directory: ./backend/database
        run: npm ci

      - name: Test Backend API
        working-directory: ./backend/api
        run: npm test

  build-and-scan:
    name: Build Images & Trivy Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python Worker Docker Image
        run: docker build -t medical-worker:latest ./backend/worker

      - name: Build Node.js API Docker Image
        run: docker build -t medical-api:latest -f ./backend/Dockerfile.api ./backend

      - name: Build React Frontend Docker Image
        run: docker build -t medical-frontend:latest ./frontend

      - name: Run Trivy Vulnerability Scanner on Python Worker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-worker:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Run Trivy Vulnerability Scanner on Backend API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-api:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Run Trivy Vulnerability Scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
