name: DevSecOps Pipeline

on:
  push:
    
    branches: [ "feature/python-worker", "main" ]

jobs:

  build-and-scan:
    name: Build Image & Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Python Worker Docker Image
         
        
        run: docker build -t medical-worker:latest ./backend/worker

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medical-worker:latest'
          format: 'table'
         
          severity: 'CRITICAL,HIGH'
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'