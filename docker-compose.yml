version: '3.8'

services:
  # 1. React Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # URL to communicate with the Node API (Will be updated to EC2 IP during deployment)
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - api

  # 2. Node.js API Service
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"
    volumes:
      - ./backend/api/src:/app/api/src
      - ./backend/database/src:/app/database/src
    # Provides GEMINI_API_KEY (and JWT_SECRET) for the Veda assistant
    env_file:
      - ./backend/api/.env
    environment:
      # AWS Credentials for S3, SQS, and DynamoDB access
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/240037737007/ImageProcessingQueue
      - RAW_BUCKET_NAME=${RAW_BUCKET_NAME}
      - PROCESSED_BUCKET_NAME=${PROCESSED_BUCKET_NAME}

  # 3. Python OpenCV Worker Service
  worker:
    build: ./backend/worker
    volumes:
      - ./backend/worker/worker.py:/app/worker.py
      - ./backend/worker/bone_classifier_best.pt:/app/bone_classifier_best.pt
      - ./backend/worker/fracture_best.pt:/app/fracture_best.pt
      - ./backend/worker/best.pt:/app/best.pt
    env_file:
      - ./backend/api/.env
    environment:
      - PYTHONUNBUFFERED=1
      # AWS Credentials for S3, SQS, and DynamoDB access
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/240037737007/ImageProcessingQueue
      - RAW_BUCKET_NAME=${RAW_BUCKET_NAME}
      - PROCESSED_BUCKET_NAME=${PROCESSED_BUCKET_NAME}

  # 4. cAdvisor Monitoring Service (For DevSecOps / Resource Monitoring)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
